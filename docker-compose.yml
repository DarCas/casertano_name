name: name_casertano

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY
        - NEXT_PUBLIC_CONTACT_EMAIL
        - NEXT_PUBLIC_NAME
        - NEXT_PUBLIC_VAT
        - NEXT_PUBLIC_SOCIAL_LINKEDIN
        - NEXT_PUBLIC_SOCIAL_GITHUB
        - NEXT_PUBLIC_SOCIAL_TELEGRAM

    env_file:
      - .env

    ports:
      - "3008:3008"

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M
