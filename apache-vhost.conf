<VirtualHost *:80>
    ServerName casertano.name
    ServerAlias www.casertano.name
    DocumentRoot /var/www/casertano/dist

    <Directory /var/www/casertano/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName casertano.name
    ServerAlias www.casertano.name
    DocumentRoot /var/www/casertano/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/casertano.name/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/casertano.name/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/casertano/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3001/
    ProxyPassReverse /api/ http://127.0.0.1:3001/

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/casertano-error.log
    CustomLog ${APACHE_LOG_DIR}/casertano-access.log combined
</VirtualHost>